apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: civo-launchpad
  name: civo-workshop
---
apiVersion: v1
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz { access_log off; return 200 "ok\n"; }

        location /api/ {
            proxy_pass http://workshop-backend.civo-workshop.svc.cluster.local:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / { try_files $uri $uri/ /index.html; }
    }
kind: ConfigMap
metadata:
  name: workshop-frontend-nginx
  namespace: civo-workshop
---
apiVersion: v1
kind: Secret
metadata:
  name: workshop-accounts
  namespace: civo-workshop
stringData:
  ADMIN_TOKEN: change-me-please
  WORKSHOP_ACCOUNTS: HS-01:civo-apikey-x9q2m:hackspace-01,HS-02:civo-apikey-r4v8p:hackspace-02,HS-03:civo-apikey-k7b1z:hackspace-03
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: workshop-backend
  name: workshop-backend
  namespace: civo-workshop
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: workshop-backend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: workshop-frontend
  name: workshop-frontend
  namespace: civo-workshop
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: workshop-frontend
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workshop-data
  namespace: civo-workshop
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: civo-volume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: workshop-backend
    app.kubernetes.io/part-of: civo-launchpad
  name: workshop-backend
  namespace: civo-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/name: workshop-backend
        app.kubernetes.io/part-of: civo-launchpad
    spec:
      containers:
      - env:
        - name: PORT
          value: "8080"
        - name: REGISTRATIONS_FILE
          value: /data/registrations.jsonl
        envFrom:
        - secretRef:
            name: workshop-accounts
        image: ghcr.io/dev-cer/civo-workshop-backend:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
        name: backend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: workshop-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: workshop-frontend
    app.kubernetes.io/part-of: civo-launchpad
  name: workshop-frontend
  namespace: civo-workshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: workshop-frontend
        app.kubernetes.io/part-of: civo-launchpad
    spec:
      containers:
      - image: ghcr.io/dev-cer/civo-workshop-frontend:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx-conf
          readOnly: true
          subPath: default.conf
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: workshop-frontend
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: workshop-frontend-nginx
        name: nginx-conf
      - emptyDir: {}
        name: tmp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workshop-frontend
  namespace: civo-workshop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workshop-frontend
  namespace: civo-workshop
spec:
  maxReplicas: 6
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workshop-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workshop
  namespace: civo-workshop
spec:
  ingressClassName: traefik
  rules:
  - host: workshop.CLUSTER_ID.k8s.civo.com
    http:
      paths:
      - backend:
          service:
            name: workshop-frontend
            port:
              number: 80
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-frontend-only
  namespace: civo-workshop
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workshop-frontend
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: workshop-backend
  policyTypes:
  - Ingress
