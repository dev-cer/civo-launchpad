apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../m4
patches:
  - target: { kind: HorizontalPodAutoscaler, name: workshop-frontend }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 8
