apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../m2
patches:
  - target: { kind: Deployment, name: workshop-frontend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 256Mi }
          limits: { cpu: 250m, memory: 256Mi }
