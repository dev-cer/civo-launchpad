# Civo K3s menyertakan Traefik v2 secara default (ingressClassName: traefik).
# Ganti host dengan DNS A record klaster: `civo kubernetes show <cluster>` -> <cluster-id>.k8s.civo.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workshop
  namespace: civo-workshop
spec:
  ingressClassName: traefik
  rules:
    - host: workshop.CLUSTER_ID.k8s.civo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: workshop-frontend, port: { number: 80 } }
