apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-frontend-nginx
  namespace: civo-workshop
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz { access_log off; return 200 "ok\n"; }

        location /api/ {
            proxy_pass http://workshop-backend.civo-workshop.svc.cluster.local:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-frontend
  namespace: civo-workshop
  labels: &labels
    app.kubernetes.io/name: workshop-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: civo-launchpad
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-frontend
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: workshop-frontend
      containers:
        - name: frontend
          image: ghcr.io/dev-cer/civo-workshop-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: nginx-conf
          configMap: { name: workshop-frontend-nginx }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-frontend
  namespace: civo-workshop
  labels:
    app.kubernetes.io/name: workshop-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workshop-frontend
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workshop-frontend
  namespace: civo-workshop
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: workshop-frontend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workshop-frontend
  namespace: civo-workshop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-frontend
