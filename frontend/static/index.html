<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civo Kubernetes Workshop · Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;700;900&family=Newsreader:opsz,wght@6..72,300..700&family=Hanken+Grotesk:wght@400..700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0e; --panel:#151917; --panel2:#1b201d; --line:#26302a; --line2:#334037;
  --green:#00E559; --green-d:#00b546; --green-a:rgba(0,229,89,.12);
  --text:#e6ece8; --muted:#8a978f; --dim:#5d6a62; --amber:#ffc23d; --red:#ff5d5d; --blue:#5cc8ff;
  --term:#090b0a; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
a{color:var(--green)}
button{font-family:inherit}
code,.mono{font-family:var(--mono)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;height:58px;padding:0 20px;background:rgba(13,15,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.brand .logo{font-weight:700;font-size:24px;letter-spacing:-1.5px;color:var(--green)}
.brand .sub{color:var(--muted);font-size:13px;border-left:1px solid var(--line2);padding-left:10px}
.modnav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.modnav::-webkit-scrollbar{display:none}
.modnav button{background:none;border:0;color:var(--muted);padding:8px 11px;border-radius:6px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.modnav button:hover{color:var(--text);background:var(--panel)}
.modnav button.on{color:var(--green);background:var(--green-a)}
.modnav .dd::after{content:'';display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:0 0 3px 8px}
.ddm{position:fixed;z-index:300;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:300px;box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:'Hanken Grotesk',var(--sans)}
.ddm h6{margin:6px 10px 6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ddm button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;background:none;border:0;color:var(--text);text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.ddm button:hover,.ddm button.on{background:var(--green-a)}
.ddm button small{color:var(--muted);font-size:12px}
.ddm button .d{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ddm hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.evbar{position:sticky;top:56px;z-index:40;background:#000;border-bottom:1px solid var(--line);font-family:'Hanken Grotesk',var(--sans)}
.evbar .in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:18px;height:50px;overflow-x:auto;scrollbar-width:none}
.evbar .tt{white-space:nowrap;font-size:13.5px;color:var(--muted)}.evbar .tt b{color:var(--text);font-weight:600}.evbar .tt i{font-style:normal;color:var(--green);font-weight:700;font-size:11px;letter-spacing:.12em;margin-right:8px}
.evbar nav{display:flex;gap:4px;margin-left:auto}
.evbar nav button{background:none;border:0;color:var(--muted);padding:15px 12px;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.evbar nav button:hover{color:var(--text)}.evbar nav button.on{color:var(--green);border-bottom-color:var(--green)}
.hub{max-width:1180px;margin:0 auto;padding:40px 24px 80px;font-family:'Hanken Grotesk',var(--sans)}
.hub h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:52px;margin:6px 0 8px;line-height:1}
.hub .eb{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.hub .lead{color:var(--muted);max-width:640px;margin:0 0 26px}
.hub .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.evc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .2s,transform .2s}
.evc:hover{border-color:var(--green);transform:translateY(-2px)}
.evc .k{display:flex;gap:8px;flex-wrap:wrap}.evc .k span{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}.evc .k span.g{border-color:var(--green);color:var(--green)}
.evc h2{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:32px;margin:0;line-height:1.05}
.evc h2 small{display:block;font-family:'Hanken Grotesk',var(--sans);font-size:15px;color:var(--muted);margin-top:6px;font-weight:400}
.evc ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.7}
.evc .go{margin-top:auto;color:var(--green);font-weight:600;font-size:14px}
.evc .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.evc .bar i{display:block;height:100%;background:var(--green)}
.winchip{font-family:var(--mono,monospace);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
.winchip b{color:var(--green)}.winchip.warn{border-color:#ffb020}.winchip.warn b{color:#ffb020}
.gate{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:40px 24px;font-family:'Hanken Grotesk',var(--sans);background:radial-gradient(circle at 80% 20%,rgba(0,255,111,.10),transparent 50%)}
.gate .in{max-width:1080px;width:100%;display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center}
.gate .eb{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.gate h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:60px;line-height:1.02;margin:10px 0 14px}
.gate .sub{color:var(--muted);font-size:17px;line-height:1.6;max-width:560px}
.gate .hint{font-size:14px;color:var(--muted);border-left:3px solid var(--green);padding-left:12px;margin:18px 0}
.gate .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.gate .cta .hint{flex-basis:100%;margin-top:0}
.gate .cta a{text-decoration:none;cursor:pointer}
.gate .big{background:#000;border:1.5px solid var(--green);border-radius:20px;padding:26px 28px}
.gate .big b{display:block;font-family:'Newsreader',serif;font-size:64px;color:var(--green);line-height:1;font-weight:500}
.gate .big span{color:var(--muted);font-size:14px}
.gate .helmrow{margin-top:18px;display:flex;justify-content:flex-end}.gate .helmrow svg{width:110px;height:auto}
@media(max-width:860px){.gate .in{grid-template-columns:1fr}.gate h1{font-size:44px}}
.jr{margin:26px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px}
.jr .jh{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.jr ol{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0}
.jr li{position:relative;padding:0 12px 0 0}
.jr li a{color:inherit;text-decoration:none;display:block}.jr li a:hover b{color:var(--green)}
.jr li::before{content:'';position:absolute;top:13px;left:28px;right:0;height:2px;background:var(--line)}
.jr li:last-child::before{display:none}.jr li.dn::before{background:var(--green)}
.jr .dot{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--bg,#0b0d0c);font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px}
.jr li.dn .dot{background:var(--green);border-color:var(--green);color:#000}
.jr li.now .dot{border-color:var(--green);color:var(--green);box-shadow:0 0 0 5px var(--green-a)}
.jr b{display:block;font-size:15px}.jr .t{display:block;font-family:var(--mono,monospace);font-size:11.5px;color:var(--green);margin:3px 0}
.jr .d{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.jr em{display:inline-block;margin-top:8px;font-style:normal;font-size:11px;font-weight:700;background:var(--green);color:#000;border-radius:99px;padding:2px 9px}
@media(max-width:900px){.jr ol{grid-auto-flow:row}.jr li::before{display:none}}
.trk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0 8px}
.lb tr.me td{background:#063d1f}.lb tr.me td:first-child{color:#fff}
.modnav button:focus{outline:none}.modnav button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.lb .of.you{background:#fff;color:#000}
@media(max-width:900px){.trk{grid-template-columns:1fr 1fr}.event .tl{grid-template-columns:1fr 1fr}}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.prog .bar{width:110px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.keychip{font-family:var(--mono);font-size:12px;padding:5px 9px;border:1px solid var(--line2);border-radius:20px;color:var(--muted);white-space:nowrap}
.keychip b{color:var(--green);font-weight:600}
.keychip.demo b{color:var(--amber)}
/* ---------- home ---------- */
.home{max-width:1180px;margin:0 auto;padding:44px 24px 80px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:600;text-transform:uppercase}
.hero h1{font-size:46px;line-height:1.05;margin:12px 0 16px;letter-spacing:-1.5px}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p.lead{color:var(--muted);font-size:17px;line-height:1.6;max-width:560px}
.cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:11px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#03140a}
.btn.primary:hover{box-shadow:0 0 22px rgba(0,229,89,.35)}
.btn.sm{padding:7px 12px;font-size:13px}
.stats{display:flex;gap:28px;margin-top:30px}
.stats div b{display:block;font-size:26px;color:var(--text)}
.stats div span{font-size:12.5px;color:var(--muted)}
.archcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.archcard h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
section.block{margin-top:64px}
section.block h2{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
section.block p.sec{color:var(--muted);margin:0 0 22px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 10px}
.mod .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mod .num{font-family:var(--mono);color:var(--green);font-size:12px}
.mod h3{margin:4px 0 6px;font-size:18px}
.mod p{color:var(--muted);font-size:13.5px;margin:0 0 10px;line-height:1.5}
.labrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.labrow:hover{background:var(--panel2)}
.labrow .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:10px}
.labrow.done .dot{background:var(--green);border-color:var(--green);color:#03140a}
.labrow .t{flex:1;font-size:14px}
.labrow .m{font-size:12px;color:var(--dim);font-family:var(--mono)}
.tag{font-size:10.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--muted)}
table.map{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.map th,table.map td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
table.map th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:1px;background:var(--panel2)}
table.map td:nth-child(2){color:var(--green)}
table.map td:nth-child(3){color:var(--muted)}
.howgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.how{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.how b{font-family:var(--mono);color:var(--green);font-size:13px}
.how h4{margin:6px 0;font-size:15.5px}
.how p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
footer{margin-top:70px;color:var(--dim);font-size:12.5px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
/* ---------- lab ---------- */
.lab{display:grid;grid-template-columns:minmax(380px,460px) 1fr;height:calc(100vh - 58px)}
.instr{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.instr .scroll{overflow-y:auto;padding:22px 24px 30px;flex:1}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);cursor:pointer;text-decoration:none}
.crumb a:hover{color:var(--green)}
.instr h2{margin:8px 0 8px;font-size:24px;letter-spacing:-.5px}
.meta{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.introtext{color:#c4cec8;line-height:1.65;font-size:14.5px}
.introtext code,.task .desc code,.why code{background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:12.5px;color:#cfe}
.note{border-left:3px solid var(--amber);background:rgba(255,194,61,.07);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px;color:#e9dcb8;margin:12px 0;line-height:1.55}
.note.info{border-color:var(--blue);background:rgba(92,200,255,.07);color:#cbe9f7}
pre.yaml{background:var(--term);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;color:#b9c7bf;overflow:auto;max-height:280px;line-height:1.5}
.tasks{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.task{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:14px}
.task.done{border-color:rgba(0,229,89,.45)}
.task .th{display:flex;gap:10px;align-items:center}
.task .n{width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-family:var(--mono);flex:none}
.task.done .n{background:var(--green);color:#03140a;border-color:var(--green)}
.task .tt{font-weight:600;font-size:14.5px}
.task .desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:8px 0 0 34px}
.cmd{margin:10px 0 0 34px;background:var(--term);border:1px solid var(--line);border-radius:8px;display:flex;align-items:stretch}
.cmd code{flex:1;padding:10px 12px;font-size:12.5px;color:var(--green);white-space:pre-wrap;word-break:break-all;line-height:1.5}
.cmd .acts{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.cmd button{background:none;border:0;color:var(--muted);font-size:11.5px;padding:6px 10px;cursor:pointer;flex:1}
.cmd button:hover{color:var(--green);background:var(--panel2)}
.cmd button+button{border-top:1px solid var(--line)}
.quiz{margin-top:22px;border:1px dashed var(--line2);border-radius:10px;padding:16px}
.quiz h4{margin:0 0 4px;font-size:13px;color:var(--green);letter-spacing:1px;text-transform:uppercase}
.quiz .q{font-weight:600;margin:6px 0 12px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--line2)}
.opt.right{border-color:var(--green);background:var(--green-a)}
.opt.wrong{border-color:var(--red);background:rgba(255,93,93,.08)}
.why{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:6px}
.labfoot{border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel)}
.labfoot .st{font-size:12.5px;color:var(--muted)}
.work{display:flex;flex-direction:column;min-height:0;background:var(--term)}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
.tab{padding:14px 20px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--green);border-bottom-color:var(--green)}
.tabs .sp{flex:1}
.tabs .env{font-size:12px;color:var(--dim);padding-right:16px;font-family:var(--mono)}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
#term{flex:1;overflow-y:auto;padding:16px 18px;font-family:var(--mono);font-size:13.5px;line-height:1.55;color:#b8c4bd;white-space:pre-wrap;word-break:break-word}
#term .p{color:var(--green)}
#term .ok{color:var(--green)}
#term .warn{color:var(--amber)}
#term .err{color:var(--red)}
#term .info{color:var(--blue)}
#term .dim{color:var(--dim)}
.inrow{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:13.5px}
.inrow .p{color:var(--green);white-space:nowrap}
.inrow input{flex:1;background:none;border:0;outline:none;color:var(--text);font-family:var(--mono);font-size:13.5px}
#dash{padding:24px;overflow-y:auto}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.dcard h5{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.dcard .big{font-size:20px;font-weight:600}
.dcard .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--line);gap:10px}
.dcard .row:first-of-type{border-top:0}
.dcard .row span:last-child{color:var(--muted);font-family:var(--mono);font-size:12px;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--line);color:var(--muted)}
.badge.building{background:rgba(255,194,61,.1);color:var(--amber);border:1px solid var(--amber)}
.badge.active{background:var(--green-a);color:var(--green);border:1px solid var(--green)}
.empty{color:var(--dim);font-size:13px}
/* loader */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;transition:opacity .4s}
#loading .rk{animation:hover 2s infinite ease-in-out;filter:drop-shadow(0 0 22px rgba(0,229,89,.55))}
@keyframes hover{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(3deg)}}
#loading h1{color:var(--green);font-weight:400;letter-spacing:2px;font-size:22px;margin:26px 0 6px}
#loading p{color:var(--muted);font-style:italic;margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--green);color:var(--text);padding:10px 16px;border-radius:8px;font-size:14px;z-index:200;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* ---------- v0.2: wheel, stepper, launch, celebrations ---------- */
.wheel{display:inline-block;vertical-align:middle;overflow:visible}
.wheel .wg{transform-origin:0 0}
.wheel.spin .wg{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel .spk-focus{animation:spk 1s ease-in-out 4}
@keyframes spk{50%{fill:#ffffff}}
.wheel.pop{animation:pop .8s cubic-bezier(.2,1.5,.4,1)}

  try { const r=await fetch('/api/window'); const j=await r.json();
    if (j && j.now){ SKEW = j.now*1000 - Date.now(); if (WINDOW && j.open && j.close){ WINDOW.o=j.open*1000; WINDOW.c=j.close*1000 } } } catch(e){}
}
function fmtLeft(ms){ const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), m=Math.floor(ms%36e5/6e4), s=Math.floor(ms%6e4/1e3);
  return d>0 ? `${d}d ${h}h ${String(m).padStart(2,'0')}m` : h>0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m ${String(s).padStart(2,'0')}s` }
function tickWindow(){
  const el=$('#winchip'); const g=gate();
  if (el){ if (!WINDOW){ el.style.display='none' } else {
    el.style.display=''; el.classList.toggle('warn', g==='open' && WINDOW.c-nowMs()<3600e3);
    el.innerHTML = sessionPreview() ? '👁 Preview mode' : g==='open' ? `⏱ Closes in <b>${fmtLeft(WINDOW.c-nowMs())}</b>` : g==='before' ? `Opens in <b>${fmtLeft(WINDOW.o-nowMs())}</b>` : 'Closed' } }
  const gc=$('#gatecount'); if (gc && g==='before') gc.textContent=fmtLeft(WINDOW.o-nowMs());
  if (LASTGATE!==null && g!==LASTGATE){ LASTGATE=g; route() } else LASTGATE=g;
}
function renderGate(g){
  CUR=null; markNav(null); clearInterval(TICK);
  const t = g==='before'
    ? { eb:'Launchpad opens soon', h:`Opens ${WINDOW.day}`, sub:`Doors open at ${WINDOW.start} when the ${EDITION==='workshop'?'workshop':'webinar'} starts, and stay open until 23:59 WIB the same day.`,

        cta: EDITION==='workshop' ? `<p class="hint">Before you come: <b>sign up for your own Civo account</b> at dashboard.civo.com (card required, not prepaid/virtual) — you need it to register, and your $250 credit lands there. You create your own cluster in the race; bring a laptop with <code>civo</code> CLI, <code>kubectl</code> and <code>git</code> installed, and your Civo API key.</p><a class="btn primary" href="${REG_FORM}" target="_blank" rel="noopener">Not registered? Register now ↗</a>`
             : `<p class="hint">Join the live session on Zoom, then come back here for the take-home journey.</p><a class="btn primary" href="${REG_FORM}" target="_blank" rel="noopener">Not registered? Register now ↗</a>` }
    : { eb:'Launchpad closed', h:'Thanks for sailing with us', sub:`This Launchpad was open on ${WINDOW.day}, from ${WINDOW.start} until 23:59 WIB. Your progress stays in this browser.`,
        big:`<b>${LABS.filter(labDone).length}/${LABS.length}</b><span>labs you completed</span>`,
        cta: (EDITION==='workshop' ? `<a class="btn" onclick="go('ev/beyond-scaling/leaderboard')">🏆 Final leaderboard</a> ` : `<a class="btn" href="${REG_FORM}" target="_blank" rel="noopener">Next Civo event ↗</a> `)
             + `<a class="btn primary" href="${LINKS.academy}" target="_blank" rel="noopener">Keep learning in the Academy ↗</a>` };
  $('#app').innerHTML = `<section class="gate"><div class="in">
    <div class="l"><div class="eb">${t.eb}</div><h1>${t.h}</h1><p class="sub">${t.sub}</p><div class="cta">${t.cta}</div></div>
    <div class="r"><div class="big">${t.big}</div><div class="helmrow">${MASCOTS.helm.svg()}</div></div></div></section>`;
  window.scrollTo(0,0);
}

  quiz:{ q:'Which label does Civo add to every node to identify its pool?', o:['eks.amazonaws.com/nodegroup','kubernetes.civo.com/node-pool','node.kubernetes.io/pool','civo.io/group'], a:1, why:'Civo adds <code>kubernetes.civo.com/node-pool</code> and <code>kubernetes.civo.com/node-size</code>, which you can use in nodeSelectors and affinity rules.' } },

{ id:'exposing', mod:'fund', title:'Expose NusaMart (Civo Load Balancer)', dur:'5 min', level:'Beginner',
  intro:`The NusaMart Service is of type <b>LoadBalancer</b>, so Civo creates a <b>Civo Load Balancer</b> with a public IP automatically. For many apps on one entry point you would use a <b>Traefik Ingress</b> instead (already installed on Civo).`,
  tasks:[
    { t:'Wait for the External IP', cmd:'kubectl get svc ecommerce-rust-svc -n nusamart', re:/^kubectl get (svc|service) ecommerce-rust-svc -n nusamart( -w)?$/, need:'sample', fx:()=>{S.res.lb=true}, out:'NAME                 TYPE           CLUSTER-IP     EXTERNAL-IP     PORT(S)        AGE\necommerce-rust-svc   LoadBalancer   10.43.88.140   212.2.244.91    80:31847/TCP   52s' },
    { t:'Open the shop', d:'The storefront shows the 12.12 banner and, in the footer, which pod served you.', cmd:'curl -s http://212.2.244.91/health', re:/^curl -s \S+\/health$/, need:'sample', out:'{"build":"1-3ac931a","instance":"ecommerce-rust-6c9f7d8b5-x2kqp","status":"ok","storage":"memory","version":"0.2.0"}\n<span class="ok">✓ NusaMart is live — open http://212.2.244.91 in your browser</span>' },
    ...(EDITION==='workshop' ? [] : [{ t:'Find the LB in Civo', cmd:'civo loadbalancer ls', re:/^civo (loadbalancer|lb) (ls|list)$/, need:'active', out:()=>S.res.lb?'+----------+-----------------------------------+-------------+--------------+\n| ID       | Name                              | Algorithm   | Public IP    |\n+----------+-----------------------------------+-------------+--------------+\n| 9a1c…    | '+(S.cluster.name||'civo-k8s-lab')+'-nusamart-ecommerce | round_robin | 212.2.244.91 |\n+----------+-----------------------------------+-------------+--------------+':'No load balancers found' }]),
  ],
  quiz:{ q:'What is the main trade-off of a LoadBalancer Service compared to an Ingress?', o:['LoadBalancers do not support TCP','Every LoadBalancer Service creates its own billable Civo LB; an Ingress shares one entry point','Ingress cannot do HTTPS','There is none'], a:1, why:'One Ingress controller serves many hosts/paths. A LoadBalancer fits a single public app or non-HTTP traffic, but each Service equals one LB.' } },


{ id:'storage', mod:'fund', title:'Persistent Storage', dur:'10 min', level:'Intermediate',
  intro:`The default StorageClass on Civo is <code>civo-volume</code> (CSI block storage). A PVC automatically provisions a Civo Volume.
  <pre class="yaml">apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data, namespace: demo }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: civo-volume
  resources: { requests: { storage: 5Gi } }</pre>`,
  tasks:[
    { t:'Check the StorageClass', cmd:'kubectl get storageclass', re:/^kubectl get (storageclass|sc)$/, need:'active', out:'NAME                    PROVISIONER            RECLAIMPOLICY   VOLUMEBINDINGMODE      ALLOWVOLUMEEXPANSION\ncivo-volume (default)   csi.civo.com           Delete          WaitForFirstConsumer   true' },
    { t:'Create a PVC', cmd:'kubectl apply -f pvc.yaml', re:/^kubectl apply -f pvc\.yaml$/, need:'active', fx:()=>{S.res.pvc=true}, out:'persistentvolumeclaim/data created' },
    { t:'Find the volume in Civo', d:'The volume appears once a pod uses the PVC (WaitForFirstConsumer).', cmd:'civo volume ls', re:/^civo volume (ls|list)$/, need:'active', out:()=>S.res.pvc?'+----------+------------------------------------------+---------+----------+\n| ID       | Name                                     | Size    | Status   |\n+----------+------------------------------------------+---------+----------+\n| 5d2e…    | pvc-1c7a9f0e-2b44-4d3a-9e1f-7a0c3d5b8e21 | 5 GB    | attached |\n+----------+------------------------------------------+---------+----------+':'No volumes found' },
  ],
  quiz:{ q:'What does the WaitForFirstConsumer volume binding mode mean?', o:['The volume is created when the PVC is created','The volume is created & attached when the first pod using it is scheduled','The volume is single-user only','The PVC waits for admin approval'], a:1, why:'Provisioning is delayed until the scheduler picks a node, so the volume is created in the right place.' } },

{ id:'objectstore', mod:'fund', title:'Object Store (S3-compatible)', dur:'10 min', level:'Intermediate',
  intro:`Civo Object Store is S3-compatible — apps using the AWS SDK or a MinIO client only need a new endpoint and credentials. Great for assets, Velero backups or ML datasets.<div class="note amber">Object Store availability in the Jakarta region (JKT1) is still being confirmed. Until then, use an S3-compatible store in another Civo region or an external provider.</div>`,
  tasks:[
    { t:'Create an object store', cmd:'civo objectstore create workshop-assets --size 500', re:/^civo objectstore create \S+.*$/, fx:()=>{S.res.os=true}, out:()=>`Creating Object Store workshop-assets in ${S.region||EVENT_REGION}…\nObject Store (workshop-assets) is being created` },
    { t:'List object stores', cmd:'civo objectstore ls', re:/^civo objectstore (ls|list)$/, out:()=>S.res.os?'+----------+-----------------+---------+----------------------------------+--------+\n| ID       | Name            | Size    | Object Store Endpoint            | Status |\n+----------+-----------------+---------+----------------------------------+--------+\n| 81fa…    | workshop-assets | 500     | objectstore.lon1.civo.com        | ready  |\n+----------+-----------------+---------+----------------------------------+--------+':'No object stores found' },
  ],
  quiz:{ q:'What needs to change for an app built on the AWS S3 SDK to use Civo Object Store?', o:['Rewrite the application','The endpoint URL and the access/secret keys','Only the region','It is not possible'], a:1, why:'Because the API is S3-compatible, setting <code>endpoint_url</code> and credentials (plus path-style access if needed) is usually enough.' } },

/* ---------------- AUTOSCALING ---------------- */
{ id:'rightsize', mod:'scale', title:'Right-size NusaMart: Requests, Limits & QoS', dur:'10 min', level:'Intermediate',
  intro:`Requests are what the scheduler reserves; limits are the ceiling at runtime. NusaMart "before" runs <b>1 replica</b> with <code>50m</code> request and a <code>100m</code> CPU limit — <b>Burstable</b>. Under a flash sale it does not crash; it gets <b>CPU-throttled</b> and slow. Slow is the new down.
  <div class="note">Memory over the limit → OOMKilled (restart). CPU over the limit → throttling (latency). Requests = limits for CPU and memory → <b>Guaranteed</b>.</div>`,
  tasks:[
    { t:'Check the QoS class', cmd:'kubectl get pods -n nusamart -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass', re:/^kubectl get (pods|po) -n nusamart -o custom-columns=.*qosClass$/, need:'sample', out:()=>{const q=S.res.guaranteed?'<span class="ok">Guaranteed</span>':'<span class="warn">Burstable</span>';return `NAME                              QOS\necommerce-rust-6c9f7d8b5-x2kqp    ${q}`+(S.res.guaranteed?`\necommerce-rust-6c9f7d8b5-m8wzt    ${q}`:'')} },
    { t:'Feel the flash sale', d:'Run the in-cluster k6 load test (45 s, 150 shoppers).', cmd:'kubectl apply -k k6', re:/^kubectl apply -k k6\/?$/, need:'sample', fx:()=>{S.res.k6run=true}, out:()=>`namespace/loadtest created\nconfigmap/k6-script created\njob.batch/k6-flash-sale created\n<span class="dim">Read the result:</span> kubectl logs -f job/k6-flash-sale -n loadtest\n\nNusaMart 12.12 flash sale - mission (quick)\n  p95 latency        ${S.res.guaranteed?'<span class="ok">160 ms</span>':'<span class="warn">4.9 s</span>'}   (target &lt; 500 ms)\n  failed requests    0` },
    { t:'Make it Guaranteed', d:'Set requests equal to limits for CPU and memory.', cmd:'kubectl set resources deploy/ecommerce-rust -n nusamart --requests=cpu=500m,memory=128Mi --limits=cpu=500m,memory=128Mi', re:/^kubectl set resources (deployment|deploy)[ \/]ecommerce-rust -n nusamart --requests=\S+ --limits=\S+$/, need:'sample', fx:()=>{S.res.guaranteed=true}, out:'deployment.apps/ecommerce-rust resource requirements updated' },
    { t:'Add a second replica', cmd:'kubectl scale deploy/ecommerce-rust -n nusamart --replicas=2', re:/^kubectl scale (deployment|deploy)[ \/]ecommerce-rust -n nusamart --replicas=\d+$/, need:'sample', out:'deployment.apps/ecommerce-rust scaled\n<span class="ok">✓ Run task 1 and 2 again: QoS Guaranteed and p95 drops from seconds to milliseconds</span>' },
  ],
  quiz:{ q:'NusaMart "before" is slow under load but never restarts. What is the most likely cause?', o:['OOMKilled','CPU throttling from a low CPU limit','A failing liveness probe','DNS'], a:1, why:'Going over the CPU limit throttles the container (latency rises) while going over the memory limit kills it. A 100m limit on a CPU-heavy endpoint is throttled hard.' } },


{ id:'hpa', mod:'scale', title:'Autoscale NusaMart (HPA)', dur:'10 min', level:'Intermediate',
  intro:`metrics-server is installed by default on Civo. The HPA computes <code>desired = ceil(current × usage / target)</code>, where usage is a percentage of the CPU <b>request</b> — that is why we right-sized first.`,
  tasks:[
    { t:'Create the HPA', cmd:'kubectl autoscale deploy ecommerce-rust -n nusamart --cpu-percent=60 --min=2 --max=8', re:/^kubectl autoscale (deployment|deploy) ecommerce-rust -n nusamart .*$/, need:'sample', fx:()=>{S.res.hpa=true}, out:'horizontalpodautoscaler.autoscaling/ecommerce-rust autoscaled' },
    { t:'Generate load', cmd:'kubectl delete job k6-flash-sale -n loadtest --ignore-not-found; kubectl apply -k k6', re:/kubectl apply -k k6\/?$/, need:'sample', fx:()=>{S.res.load=true}, out:'job.batch "k6-flash-sale" deleted\njob.batch/k6-flash-sale created' },
    { t:'Watch the HPA', cmd:'kubectl get hpa -n nusamart', re:/^kubectl get hpa -n nusamart( -w)?$/, need:'sample', out:()=>!S.res.hpa?'No resources found in nusamart namespace.':S.res.load?'NAME             REFERENCE                   TARGETS        MINPODS   MAXPODS   REPLICAS   AGE\necommerce-rust   Deployment/ecommerce-rust   cpu: 148%/60%  2         8         5          3m\n<span class="ok">✓ Scaled out from 2 → 5 replicas</span>':'NAME             REFERENCE                   TARGETS       MINPODS   MAXPODS   REPLICAS   AGE\necommerce-rust   Deployment/ecommerce-rust   cpu: 3%/60%   2         8         2          1m' },
  ],
  quiz:{ q:'What does a CPU-based HPA need in order to work?', o:['Prometheus Adapter','metrics-server and CPU resources.requests on the container','Cluster Autoscaler','An Ingress'], a:1, why:'Utilization is calculated relative to <code>requests</code>. Without requests the HPA shows <code>&lt;unknown&gt;</code>.' } },


{ id:'node-scaling', mod:'scale', title:'Scaling Node Pools', dur:'10 min', level:'Intermediate',
  intro:`When pods are Pending because capacity is exhausted, add nodes to a pool — manually via the CLI/Terraform, or automatically with the <b>Civo cluster autoscaler</b> from the Marketplace (default range 1–10 nodes, tunable via <code>--nodes=min:max:pool</code>).`,
  tasks:[
    { t:'Find the pool ID', cmd:'civo kubernetes node-pool ls civo-k8s-lab', re:/^civo (kubernetes|k8s) node-pool (ls|list) \S+$/, need:'active', out:()=>poolsOut() },
    { t:'Scale the initial pool to 4 nodes', cmd:'civo kubernetes node-pool scale civo-k8s-lab a1cd9b --nodes 4', re:/^civo (kubernetes|k8s) node-pool scale \S+ \S+ --nodes \d+$/, need:'active', fx:(m,c)=>{const n=+c.match(/--nodes (\d+)/)[1]; S.cluster.pools[0].n=n}, out:(m,c)=>`The pool a1cd9b was scaled to ${c.match(/--nodes (\d+)/)[1]} nodes` },
    { t:'Verify', cmd:'kubectl get nodes', re:/^kubectl get (nodes|no)$/, need:'active', out:()=>nodesOut() },
    { t:'Enable the cluster autoscaler', d:'Installs into <code>kube-system</code>; scales on Pending pods and scales down under-utilised nodes.', cmd:'civo kubernetes applications add civo-cluster-autoscaler --cluster civo-k8s-lab', re:/^civo (kubernetes|k8s) (applications|apps) add civo-cluster-autoscaler (--cluster|-c) \S+$/, need:'active', fx:()=>{addApp('civo-cluster-autoscaler')}, out:'Added civo-cluster-autoscaler to Kubernetes cluster civo-k8s-lab\n<span class="dim">Tune min/max: kubectl edit deployment cluster-autoscaler -n kube-system  (--nodes=1:10:workers)</span>' },
  ],
  quiz:{ q:'What is the Civo equivalent of Karpenter / the EKS Cluster Autoscaler?', o:['There is none','The cluster autoscaler from the Civo Marketplace, which scales node pools','Fargate','HPA'], a:1, why:'Civo provides a cluster autoscaler that scales node pools based on Pending pods; the HPA only scales pods.' } },

{ id:'harden', mod:'scale', title:'Harden NusaMart: PDB & Node Drain', dur:'10 min', level:'Intermediate',
  intro:`Upgrades and maintenance <b>drain</b> nodes. A <b>PodDisruptionBudget</b> caps how many NusaMart pods a voluntary disruption may take at once, so the shop keeps selling while pods move.
  <div class="note info">A PDB cannot protect a single pod — combine it with at least 2 replicas on different nodes.</div>`,
  tasks:[
    { t:'Create the PDB', cmd:'kubectl create pdb ecommerce-rust -n nusamart --selector=app=ecommerce-rust --min-available=1', re:/^kubectl create (pdb|poddisruptionbudget) ecommerce-rust -n nusamart .*$/, need:'sample', fx:()=>{S.res.pdb=true}, out:'poddisruptionbudget.policy/ecommerce-rust created' },
    { t:'See where the pods run', cmd:'kubectl get pods -n nusamart -o wide', re:/^kubectl get (pods|po) -n nusamart -o wide$/, need:'sample', out:()=>{const n=k=>`k3s-${S.cluster.name||'civo-k8s-lab'}-${(S.cluster.pools[0]||{id:'a1cd9b'}).id}-node-pool-0${k}`;return `NAME                              READY   STATUS    NODE\necommerce-rust-6c9f7d8b5-x2kqp    1/1     Running   ${n(1)}\necommerce-rust-6c9f7d8b5-m8wzt    1/1     Running   ${n(3)}`} },
    { t:'Drain a node', d:'Simulates maintenance: cordon the node and evict its pods, respecting the PDB.', cmd:()=>`kubectl drain ${k3sNode()} --ignore-daemonsets --delete-emptydir-data`, re:/^kubectl drain \S+ --ignore-daemonsets( --delete-emptydir-data)?$/, need:'active', fx:()=>{S.res.drained=true}, out:(m,c)=>{const n=c.split(' ')[2];return `node/${n} cordoned\nWarning: ignoring DaemonSet-managed Pods: kube-system/cilium-8kq2x\nevicting pod nusamart/ecommerce-rust-6c9f7d8b5-x2kqp\npod/ecommerce-rust-6c9f7d8b5-x2kqp evicted\n<span class="ok">node/${n} drained</span>`} },
    { t:'Check the shop is still selling', cmd:'curl -sI http://212.2.244.91 | head -n 1', re:/^curl -sI \S+/, need:'sample', out:()=>'HTTP/1.1 200 OK\n<span class="ok">✓ Still serving — the PDB kept at least 1 NusaMart pod running during the drain</span>' },
    { t:'Bring the node back', cmd:()=>`kubectl uncordon ${k3sNode()}`, re:/^kubectl uncordon \S+$/, need:'active', fx:()=>{S.res.drained=false}, out:(m,c)=>`node/${c.split(' ')[2]} uncordoned` },
  ],
  quiz:{ q:'NusaMart runs 2 replicas with a PDB of minAvailable: 1. How many pods can a drain evict at the same time?', o:['0','1','2','All of them'], a:1, why:'With 2 healthy replicas and minAvailable 1, the budget allows exactly 1 disruption. The drain waits until the evicted pod is replaced before taking the next.' } },


{ id:'flashsale', mod:'scale', title:'Flash Sale 12.12 Challenge', dur:'15 min', level:'Advanced',
  intro:EDITION==='workshop' ? `<b>The final mission: Flash Sale Ready.</b> Give your shop warm capacity (HPA min 3, max 8) and spread the pods across all three nodes. When you press <b>Check on my cluster</b>, Launchpad fires a live burst of 120 requests at your External IP: <b>0 errors and p95 under 1.5 s</b> passes — and stops your clock.
  <div class="note">Everything from M2–M4 counts. Do not change the image or <code>RECO_WORK</code> — the check verifies both.</div>` : `<b>The final mission.</b> At the signal, the facilitator fires the official k6 test (5 minutes, 300 shoppers) at every participant's NusaMart at once${EDITION==='workshop'?' — using the shop External IP you share in the room form, since each shop runs on its own account':''}. The leaderboard ranks <b>individuals</b>: <b>fewest failed requests</b>, then <b>lowest p95</b>, then highest throughput.
  <div class="note">Everything from M2–M4 counts: Guaranteed QoS, HPA headroom and an uncordoned node all improve your score. Do not change the image or <code>RECO_WORK</code>.</div>`,
  tasks:[
    { t:'Check your shop is ready', cmd:'kubectl get deploy,hpa,pdb -n nusamart', re:/^kubectl get (deploy|deployment),hpa,pdb -n nusamart$/, need:'sample', out:()=>`NAME                             READY   UP-TO-DATE   AVAILABLE\ndeployment.apps/ecommerce-rust   ${S.res.guaranteed?'2/2':'1/1'}     ${S.res.guaranteed?2:1}            ${S.res.guaranteed?2:1}\n\n`+(S.res.hpa||S.res.hpaTuned?`NAME                                                 REFERENCE                   TARGETS      MINPODS   MAXPODS   REPLICAS\nhorizontalpodautoscaler.autoscaling/ecommerce-rust   Deployment/ecommerce-rust   cpu: 3%/60%  ${S.res.hpaTuned?3:2}         8         ${S.res.hpaTuned?3:2}\n`:'<span class="warn">no HPA yet — see M3</span>\n')+(S.res.pdb?'\nNAME                                        MIN AVAILABLE   ALLOWED DISRUPTIONS\npoddisruptionbudget.policy/ecommerce-rust   1               1':'\n<span class="warn">no PDB yet — see M4</span>') },
    { t:'Give the HPA headroom', d:'Start warm (3 pods) and allow bursting to 8.', cmd:`kubectl patch hpa ecommerce-rust -n nusamart -p '{"spec":{"minReplicas":3,"maxReplicas":8}}'`, re:/^kubectl patch hpa ecommerce-rust -n nusamart -p .*maxReplicas.*$/, need:'sample', fx:()=>{S.res.hpaTuned=true}, out:'horizontalpodautoscaler.autoscaling/ecommerce-rust patched' },
    { t:'Run your own smoke test', cmd:'kubectl delete job k6-flash-sale -n loadtest --ignore-not-found; kubectl apply -k k6', re:/kubectl apply -k k6\/?$/, need:'sample', fx:()=>{S.res.k6=flashScore()}, out:()=>k6Out(S.res.k6) },
    { t:'Submit your score', d:EDITION==='workshop'?'Posts your self-test to the individual leaderboard under your registered name.':'Posts your self-test to the individual leaderboard under your registered name and access code.', cmd:'launchpad submit', re:/^launchpad submit\s*$/, need:'k6', needMsg:'Run your smoke test first.', fx:()=>{submitScore(S.res.k6)}, out:()=>`<span class="ok">✓ Submitted ${esc(shortName(S.myScore.name))}${S.reg&&S.reg.code?' ('+esc(S.reg.code)+')':''}: p95 ${S.res.k6.p95} ms · ${S.res.k6.errors} failed · ${S.res.k6.rps} req/s</span>\n<span class="dim">Open the Leaderboard tab to watch the ranking.</span>` },
  ],
  quiz:{ q:'Your p95 is high but there are no errors. Which change helps most for a sudden spike?', o:['Lower the memory limit','Start with more replicas (minReplicas) and give the HPA room to grow','Delete the PodDisruptionBudget','Switch the Service to NodePort'], a:1, why:'Warm capacity absorbs the first seconds of the spike while the HPA reacts; a higher maxReplicas lets it keep scaling.' } },

/* ---------------- OBSERVABILITY ---------------- */
{ id:'prometheus', mod:'obs', title:'Prometheus & Grafana', dur:'15 min', level:'Intermediate',
  intro:`The Civo Marketplace installs a full monitoring stack (Prometheus, Alertmanager, Grafana) in a single command — no Helm values to write.`,
  tasks:[
    { t:'Browse marketplace apps', cmd:'civo kubernetes applications ls', re:/^civo (kubernetes|k8s) (applications|apps) (ls|list)$/, out:'+---------------------+-------------+--------------+\n| Name                | Version     | Category     |\n+---------------------+-------------+--------------+\n| argo-cd             | (latest)    | ci_cd        |\n| civo-cluster-autoscaler | v1.25.0 | management   |\n| cert-manager        | (latest)    | architecture |\n| metrics-server      | (default)   | architecture |\n| prometheus-operator | (latest)    | monitoring   |\n| Traefik-v2-nodeport | (default)   | architecture |\n| ...                 |             |              |\n+---------------------+-------------+--------------+\n<span class="dim">Note: exact names may change — always check the ls output in your account.</span>' },
    { t:'Install the monitoring stack', cmd:'civo kubernetes applications add prometheus-operator --cluster civo-k8s-lab', re:/^civo (kubernetes|k8s) (applications|apps) add prometheus-operator --cluster \S+$/, need:'active', fx:()=>{addApp('prometheus-operator')}, out:'Added prometheus-operator to Kubernetes cluster civo-k8s-lab' },
    { t:'Check the monitoring pods', cmd:'kubectl get pods -n monitoring', re:/^kubectl get (pods|po) -n monitoring$/, need:'active', out:'NAME                                                   READY   STATUS    AGE\nalertmanager-prometheus-operator-alertmanager-0        2/2     Running   1m\nprometheus-operator-grafana-7d9f6c8b5-xk2pq            3/3     Running   1m\nprometheus-operator-kube-state-metrics-6c9b7-8hm4d     1/1     Running   1m\nprometheus-prometheus-operator-prometheus-0            2/2     Running   1m' },
    { t:'Open Grafana', d:'Find the Service name with <code>kubectl get svc -n monitoring</code>, then port-forward.', cmd:'kubectl port-forward -n monitoring svc/prometheus-operator-grafana 3000:80', re:/^kubectl port-forward -n monitoring svc\/\S+ \d+:\d+$/, need:'active', out:'Forwarding from 127.0.0.1:3000 -> 3000\n<span class="ok">✓ Grafana: http://localhost:3000</span>' },
  ],
  quiz:{ q:'Which component sends alert notifications to Slack or email?', o:['Grafana','kube-state-metrics','Alertmanager','node-exporter'], a:2, why:'Prometheus evaluates the rules; Alertmanager handles grouping, silencing and routing of notifications.' } },

/* ---------------- SECURITY ---------------- */
{ id:'firewall', mod:'sec', title:'Civo Firewall', dur:'10 min', level:'Intermediate',
  intro:`<code>--create-firewall</code> opens ports 80, 443 and 6443 to the world. For production, restrict the API server (6443) to your office/VPN IPs.`,
  tasks:[
    { t:'List firewalls', cmd:'civo firewall ls', re:/^civo (firewall|fw) (ls|list)$/, need:'active', out:()=>`+----------+------------------------------+---------+-------------+\n| ID       | Name                         | Network | Total rules |\n+----------+------------------------------+---------+-------------+\n| 4c1d…    | ${FW()} | default | 3           |\n+----------+------------------------------+---------+-------------+` },
    { t:'List rules', cmd:()=>`civo firewall rule ls ${FW()}`, re:/^civo (firewall|fw) rule (ls|list) \S+$/, need:'active', out:'+------+----------+------------+----------+-----------+\n| ID   | Protocol | Start Port | End Port | CIDR      |\n+------+----------+------------+----------+-----------+\n| 91a… | tcp      | 80         | 80       | 0.0.0.0/0 |\n| 92b… | tcp      | 443        | 443      | 0.0.0.0/0 |\n| 93c… | tcp      | 6443       | 6443     | 0.0.0.0/0 |\n+------+----------+------------+----------+-----------+' },
    { t:'Restrict 6443 to your office IP', d:'Add a rule for your office CIDR, then delete the public 6443 rule.', cmd:()=>`civo firewall rule create ${FW()} --startport 6443 --endport 6443 --cidr 203.0.113.10/32 --protocol tcp --direction ingress --label office-api`, re:/^civo (firewall|fw) rule create \S+ .*--startport 6443.*$/, need:'active', out:'New firewall rule (office-api) created' },
  ],
  quiz:{ q:'Which port does kubectl use to talk to the API server?', o:['22','443','6443','10250'], a:2, why:'The K3s API server listens on <b>6443</b>. Ports 80/443 carry application traffic through Traefik.' } },

{ id:'netpol', mod:'sec', title:'NetworkPolicy & Pod Hardening', dur:'15 min', level:'Advanced',
  intro:`The sample app ships with <code>backend-allow-frontend-only</code>: only frontend pods may reach backend:8080. Because the cluster runs Cilium, the policy is actually enforced. Pods also run as non-root, with a read-only root filesystem and all capabilities dropped.`,
  tasks:[

function route(){
  clearInterval(TICK);
  const h = location.hash.slice(1) || (!S.reg ? 'enter' : myEventRoute());
  const g = gate();
  if (g!=='open' && !(g==='closed' && EDITION==='workshop' && h.endsWith('leaderboard'))) return renderGate(g);
  document.body.classList.remove('sky');
  if (h==='register' || h==='enter') return renderEnter();
  closeDD();
  const isEv = h==='events'||h==='event'||h==='leaderboard'||h.startsWith('ev/');
  if (EDITION==='academy' && isEv) return go('home');
  if (EDITION!=='academy' && (h==='home'||h==='events'||h.startsWith('mod-'))) return go(ED.home);
  if (EDITION==='webinar' && (h==='event'||h==='leaderboard'||h.startsWith('ev/beyond'))) return go(ED.home);
  if (EDITION==='workshop' && h.startsWith('ev/k8s')) return go(ED.home);
  if (h==='events') return renderEvents();
  if (h==='event' || h==='ev/beyond-scaling') return renderEvent();
  if (h==='leaderboard' || h==='ev/beyond-scaling/leaderboard') return renderLeaderboard();
  if (h==='ev/k8s-at-scale') return renderWebinarTrack();
  if (h==='certificate' && EDITION==='workshop') return renderCert();
  if (h==='library') return renderLibrary();
  if (h.startsWith('lab-')) { const l = LABS.find(x => x.id === h.slice(4));
    if (l && !S.reg){ S.pendingLab = l.id; save(); toast('Enter Launchpad first to claim your lab'); return go('enter') }
    if (l) return renderLab(l) }
  S.ctx=null;
  if (h.startsWith('mod-')) { renderHome(); setTimeout(()=>{ const el=document.getElementById(h); el && el.scrollIntoView({behavior:'smooth'}) },30); return markNav(h.slice(4)) }
  renderHome();
}

function modFrac(){ return MODULES.map(m=>{ const ls=LABS.filter(l=>l.mod===m.id); return ls.filter(labDone).length/ls.length }) }
// Helm wheel: 8 spokes = 8 modules. A spoke lights fully when its module is complete, dimly when partial.
function wheelSVG(size, o={}){
  const fr = o.fr || modFrac(); let sp='';
  for (let i=0;i<8;i++){
    const f = o.all ? 1 : fr[i];
    const col = f>=1 ? '#00E559' : f>0 ? '#0b7a37' : (o.mark===i ? '#1f4a2f' : '#26302a');
    const st  = f>=1 ? '#00b546' : (o.mark===i ? '#00b546' : '#334037');
    sp += `<g transform="rotate(${i*45-90})"><rect x="7" y="-4.6" width="48" height="9.2" rx="1.6" fill="${col}" stroke="${st}" stroke-width="1"${o.focus===i?' class="spk-focus"':''}/></g>`;
  }
  const rim = o.all || fr.some(f=>f>0) || o.rim ? '#00E559' : '#2c3a31';
  return `<svg class="wheel ${o.spin?'spin':''} ${o.cls||''}" width="${size}" height="${size}" viewBox="-60 -60 120 120" aria-hidden="true"><g class="wg">`+
    `<circle r="38" fill="none" stroke="#06140b" stroke-width="7" transform="translate(1.5 2)"/>`+
    `<circle r="38" fill="none" stroke="${rim}" stroke-width="5.5"/>${sp}`+
    `<circle r="10.5" fill="#00E559" stroke="#00b546"/><circle r="4.2" fill="#0d0f0e"/></g></svg>`;
}
function rocketSVG(){
  return `<svg width="92" height="150" viewBox="0 0 92 150" aria-label="Civo rocket">
    <path class="flame" d="M36 92c2 22 6 40 10 52 4-12 8-30 10-52z" fill="#ffc23d"/>
    <path class="flame" d="M41 92c1 14 3 26 5 34 2-8 4-20 5-34z" fill="#fff3c4"/>
    <path d="M46 4c18 14 26 36 24 66H22C20 40 28 18 46 4z" fill="#1b201d" stroke="#00E559" stroke-width="3"/>
    <circle cx="46" cy="40" r="9" fill="#090b0a" stroke="#00E559" stroke-width="3"/>
    <path d="M22 56 6 80l17-3zM70 56l16 24-17-3z" fill="#00E559"/>
    <path d="M33 70h26l-4 22H37z" fill="#26302a" stroke="#334037"/>
  </svg>`;
}
function confetti(n=150){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.className='confetti'; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const x=c.getContext('2d'), cols=['#00E559','#7dffb0','#ffffff','#ffc23d','#5cc8ff'];
  const P=Array.from({length:n},()=>({x:innerWidth*(.3+Math.random()*.4),y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-5,r:Math.random()*7+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.35}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.vy+=.38; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/3,p.r,p.r*.6); x.restore() });
    if (t-t0<2800) requestAnimationFrame(f); else c.remove() })(t0);
}

/* =========================================================
   TERMINAL SIMULATOR — typing effect, spinner, rocket launch
   ========================================================= */
const HIST = []; let hpos = 0, busy = false;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function out(html, cls){ const t=$('#term'); if(!t) return; const div=document.createElement('div'); if(cls) div.className=cls; div.innerHTML=html; t.appendChild(div); t.scrollTop=t.scrollHeight }
async function typeOut(html, cls){
  const lines = String(html).split('\n'), dl = Math.max(10, Math.min(55, 1000/lines.length));
  for (const ln of lines){ out(ln===''?'&nbsp;':ln, cls); await sleep(dl) }
}
async function spinner(ms){
  const t=$('#term'); if(!t) return; const el=document.createElement('div'); el.className='dim'; t.appendChild(el);
  const fr='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'; let k=0; const end=Date.now()+ms;
  while (Date.now()<end){ el.textContent = fr[k++%fr.length] + ' running…'; t.scrollTop=t.scrollHeight; await sleep(70) }
  el.remove();
}
function termIntro(l){
  out(`<span class="dim">Civo Launchpad lab terminal · ${new Date().toLocaleString('en-GB')}\nLab: ${l.title} — ${l.tasks.length} tasks. Type "hint" for the next command.</span>`);
  if (S.demo) out('<span class="warn">Demo mode: the workshop backend is unreachable; all output is simulated.</span>');
}
function bindInput(){
  const inp = $('#cmdin');
  inp.addEventListener('keydown', e=>{
    if (e.key==='Enter'){ const v=inp.value; inp.value=''; exec(v) }
    else if (e.key==='ArrowUp'){ if(hpos>0){ hpos--; inp.value=HIST[hpos]||'' } e.preventDefault() }
    else if (e.key==='ArrowDown'){ if(hpos<HIST.length){ hpos++; inp.value=HIST[hpos]||'' } e.preventDefault() }
    else if (e.key==='Tab'){ e.preventDefault(); const nt=nextTask(); if(nt!==-1 && !inp.value) inp.value = val(CUR.tasks[nt].cmd) }
  });
  inp.focus();
}
function nextTask(){
  const d = S.done[CUR.id];
  if (S.mode==='guided'){ const s = stepsOf(CUR)[S.step[CUR.id].cur]; if (s && s.k==='task' && !d.tasks[s.i]) return s.i }
  return CUR.tasks.findIndex((_,i)=>!d.tasks[i]);
}

async function exec(raw){
  if (busy) return;
  const c = raw.trim().replace(/\s+/g,' ');
  out(`<span class="p">root@civo-lab:~$</span> ${esc(raw)}`);
  if (!c) return;
  HIST.push(c); hpos = HIST.length;

  if (c==='clear'){ $('#term').innerHTML=''; return }
  if (c==='help') return out('Commands supported by the simulator: civo …, kubectl …, helm …, terraform …, argocd …, k6 …, launchpad submit\nBuiltins: help, hint, clear, history, whoami, ls\nTip: press <b>Tab</b> on an empty prompt to autofill the next task command; ↑/↓ for history.', 'dim');
  if (c==='hint'){ const nt=nextTask(); return out(nt===-1?'All tasks done — answer the quiz in the left panel.':`Task ${nt+1}: ${CUR.tasks[nt].t}\n→ ${esc(val(CUR.tasks[nt].cmd))}`, 'info') }
  if (c==='history') return out(HIST.map((h,i)=>`  ${i+1}  ${esc(h)}`).join('\n'));
  if (c==='whoami') return out('root');
  if (c==='ls') return out('kubeconfig.yaml  k8s/  k6/  pvc.yaml  gpu-smoke-test.yaml  main.tf');
  if (c==='civo kubernetes ls' || c==='civo k8s ls') return out(S.cluster.status==='none'||S.cluster.status==='deleted' ? 'No clusters found' : `+--------------+--------------+--------+----------+\n| ID           | Name         | Region | Status   |\n+--------------+--------------+--------+----------+\n| ${CID().slice(0,12)} | civo-k8s-lab | ${REGION().padEnd(6)} | ${S.cluster.status.toUpperCase().padEnd(8)} |\n+--------------+--------------+--------+----------+`);

  let lab = CUR, ti = CUR.tasks.findIndex(t => t.re.test(c));
  if (ti === -1) for (const L of LABS){ const k=L.tasks.findIndex(t=>t.re.test(c)); if(k!==-1){ lab=L; ti=k; break } }
  if (ti === -1){
    if (/^(civo|kubectl|helm|terraform|argocd|k6|launchpad|hackspace|curl)\b/.test(c)) return out(`<span class="warn">The simulator does not recognise this command variant yet.</span> <span class="dim">Type "hint" for the expected command.</span>`);
    return out(`<span class="err">bash: ${esc(c.split(' ')[0])}: command not found</span>`);
  }
  const t = lab.tasks[ti];
  if (t.need==='active' && S.cluster.status!=='active') return out('<span class="err">Error: cluster civo-k8s-lab is not active.</span> <span class="dim">Complete the "Your First K3s Cluster" lab first.</span>');
  if (t.need==='sample' && !S.res.sample) return out('<span class="err">Error from server (NotFound): namespaces "nusamart" not found</span> <span class="dim">→ deploy NusaMart first (lab "Deploy NusaMart").</span>');
  if (t.need && !['active','sample'].includes(t.need) && !S.res[t.need]) return out(`<span class="err">${t.needMsg||'Complete the previous task first.'}</span>`);

  busy = true; const row = document.querySelector('.inrow'); row && row.classList.add('busy');
  try {
    if (t.async) await createCluster(c);
    else {
      const m = c.match(t.re);
      await spinner(250 + Math.random()*350);
      if (t.fx) t.fx(m, c);
      const o = val(t.out, m, c); if (o) await typeOut(o);
    }
  } finally { busy = false; row && row.classList.remove('busy') }
  if (lab === CUR) markTask(ti); else out(`<span class="dim">(this command belongs to the "${lab.title}" lab)</span>`);
  save(); labStatus(); renderDash();
}
function markTask(i){
  const d = S.done[CUR.id]; if (d.tasks[i]) return;
  d.tasks[i] = true; save();
  if (S.mode==='overview'){ const el=$('#task-'+i); if(el){ el.classList.add('done'); el.querySelector('.n').textContent='✓' } labStatus() }
  else renderStep();
  const nt = CUR.tasks.findIndex((_,k)=>!d.tasks[k]);
  out(nt===-1 ? '<span class="ok">✓ All tasks done. Answer the quiz to close the lab.</span>'
              : `<span class="ok">✓ Task ${i+1} validated.</span>${S.mode==='guided'?' <span class="dim">Click Next → in the left panel.</span>':''}`);
  maybeComplete();
}
async function createCluster(c){
  const name = (c.match(/create (\S+)/)||[])[1] || 'civo-k8s-lab';
  const nodes = +((c.match(/(?:--nodes|-n)[ =](\d+)/)||[])[1] || 3);
  const size = (c.match(/(?:--size|-s)[ =](\S+)/)||[])[1] || 'g4s.kube.medium';
  const cni = (c.match(/--cni-plugin[ =](\S+)/)||[])[1] || 'flannel';
  S.cluster = { status:'building', name, id: crypto.randomUUID ? crypto.randomUUID() : CID(), cni, apps:['Traefik-v2-nodeport','metrics-server'], pools:[{id:'a1cd9b', size, n:nodes}] };
  renderDash(); labStatus();
  try { fetch('/api/provision', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({api_key:S.apiKey, cluster_name:name})}).catch(()=>{}) } catch(e){}

  const L = $('#launch');
  if (L){ L.className='launch on'; L.innerHTML = `<div class="stars"></div><div class="lc"><div class="cd" id="cd">3</div><div class="rocketwrap" id="rw">${rocketSVG()}</div><div class="lsteps" id="lsteps"></div><div class="ltimer" id="ltimer">T-00:03 · ${esc(name)} · ${nodes} × ${esc(size)}</div></div>`;
    for (const n of ['3','2','1']){ const cd=$('#cd'); cd.textContent=n; cd.classList.remove('tick'); void cd.offsetWidth; cd.classList.add('tick'); await sleep(560) }
    $('#cd').textContent='IGNITION'; $('#rw').classList.add('shake');
  }
  const steps = ['Creating firewall k8s-'+name,'Building control plane','Provisioning node pool a1cd9b ('+nodes+' × '+size+')','Installing CNI '+cni,'Installing Traefik-v2-nodeport, metrics-server'];
  for (let i=0;i<steps.length;i++){
    out(`<span class="dim">[${String(i*17).padStart(2,'0')}s]</span> ${steps[i]}…`);
    if (L){ $('#lsteps').insertAdjacentHTML('beforeend', `<div><b>✓</b>${esc(steps[i])}</div>`); $('#ltimer').textContent = `T+00:${String(i*17+17).padStart(2,'0')} · accelerated simulation`; }
    await sleep(620);
  }
  if (L){ $('#cd').textContent='LIFTOFF'; L.classList.add('go'); $('#rw').classList.replace('shake','fly'); await sleep(1100) }
  S.cluster.status = 'active'; renderDash(); labStatus();
  if (L){ $('#cd').innerHTML='<span class="badge active" style="font-size:16px;padding:6px 16px">ACTIVE · 1 min 24 sec</span>'; confetti(90); await sleep(1100); L.classList.add('off'); setTimeout(()=>{ L.className='launch'; L.innerHTML='' }, 450) }
  await typeOut(`The cluster ${name} (${S.cluster.id}) has been created in 1 min 24 sec\nMerged with main kubernetes config: /root/.kube/config\nSwitched context to ${name}\n<span class="ok">[SUCCESS] Cluster '${name}' is now ACTIVE</span>`);
}

function flashScore(){
  let p95=480, err=37;
  if (S.res.guaranteed){ p95-=150; err-=24 }
  if (S.res.hpaTuned){ p95-=130; err-=13 }
  if ((S.cluster.pools[0]||{n:3}).n>=4 || S.cluster.apps.includes('civo-cluster-autoscaler')) p95-=30;

}

async function submitReg(e){
  e.preventDefault();
  const f=e.target, err=$('#regerr'), btn=$('#regbtn');
  const d = { first:f.first.value.trim(), last:f.last.value.trim(), company:f.company.value.trim(), title:f.title.value.trim(),
    email:f.email.value.trim(), phone:f.phone.value.trim(), location:f.location.value.trim(),
    k8s:(f.querySelector('input[name=k8s]:checked')||{}).value||'', consent:f.consent.checked };
  const need=[['first','first name'],['last','last name'],['company','company name'],['title','job title'],['email','business email'],['phone','WhatsApp number'],['location','location']];
  for (const [k,l] of need) if (!d[k]) { err.textContent=`Please fill in your ${l}.`; f[k].focus(); return }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) { err.textContent='Please enter a valid email address.'; f.email.focus(); return }
  if (!/^\+?[0-9 ()-]{8,20}$/.test(d.phone)) { err.textContent='Please enter a valid WhatsApp number.'; f.phone.focus(); return }
  if (!d.k8s) { err.textContent='Please tell us whether your organization uses Kubernetes.'; return }
  if (!d.consent) { err.textContent='Please accept the data consent to continue.'; return }
  err.textContent=''; btn.disabled=true; btn.innerHTML = wheelSVG(22,{all:true,spin:true}) + ' Preparing your cockpit…';

  // 1) Google Form (sumber utama data registrasi webinar)
  let gform='pending';
  try { await submitGForm(d); gform='sent' } catch(x){ gform='pending' }

  // 2) Backend Launchpad (akun lab + lead score)
  const body = { participant:S.participant, name:d.first+' '+d.last, email:d.email, company:d.company, role:d.title, event:'19 NOV · Kubernetes at Scale',
    phone:d.phone, location:d.location, k8s_usage:d.k8s, source:S.utm||'direct', consent:true };
  let res=null, demo=false;
  try {
    const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(), 6000);
    const r = await fetch('/api/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), signal:ctrl.signal});
    const j = await r.json().catch(()=>null);
    if (r.ok && j && j.status==='success') res=j;
    else if (j && j.message && r.status===400){ err.textContent=j.message; btn.disabled=false; btn.innerHTML='🚀 Register &amp; claim my lab account'; return }
    else demo=true;   // 503 (kursi lab penuh) atau backend tak terjangkau: registrasi webinar tetap sah, lab jalan di demo mode
  } catch(x){ demo=true }
  await sleep(600);
  finishReg(d, res, demo, gform);
}
function finishReg(d, res, demo, gform){
  if (demo){ S.apiKey = 'demo-' + Math.random().toString(36).slice(2,9); S.accountId='demo'; S.demo=true }
  else { S.apiKey=res.api_key; S.accountId=res.account_id; S.demo=false }
  S.reg = { name:d.first+' '+d.last, email:d.email, company:d.company, title:d.title, location:d.location, k8s:d.k8s,
    seat:(res&&res.seat)||(Math.random()*90+10|0), returning:!!(res&&res.returning), gform, prefill: gform==='sent'?null:gformPrefill(d), at:Date.now() };
  save(); renderKey();
  $('#fcard').innerHTML = welcomeHTML(); updatePass(); openKey(true); confetti(180);
  $('#pnote').innerHTML = gform==='sent'
    ? (S.demo ? 'Registration sent. Lab seats are full or offline, so your labs run in <b>demo mode</b>.' : 'Registration sent and your lab account is active. Keep this API key for the session.')
    : 'We could not reach Google Forms from this page — please tap <b>Confirm on Google Form</b> to finish your registration.';
}

async function submitEnter(e){
  e.preventDefault();
  const f=e.target, er=$('#enterr'), b=$('#enterb');
  const d={ name:f.name.value.trim(), email:f.email.value.trim(), code:f.code.value.trim().toUpperCase(), consent:f.consent.checked };
  if (d.name.length<2){ er.textContent='Please enter your name.'; return f.name.focus() }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){ er.textContent='Please enter a valid email address.'; return f.email.focus() }
  if (ED.code==='required' && !d.code){ er.textContent='Enter the access code from your check-in card.'; return f.code.focus() }
  if (EDITION==='workshop'){ d.civo=f.civo.value.trim(); d.civook=f.civook.checked;
    if (d.civo.length<3){ er.textContent='Enter the email or username of your own Civo account.'; return f.civo.focus() }
    if (!d.civook){ er.textContent='Sign up for your own Civo account first (pre-work), then tick the box.'; return } }
  if (!d.consent){ er.textContent='Please accept the data consent to continue.'; return }
  er.textContent=''; b.disabled=true; b.firstChild.textContent='Claiming your lab… ';
  let res=null, demo=false;
  try{
    const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({participant:S.participant,name:d.name,email:d.email,access_code:d.code,civo_account:d.civo||'',civo_signup:!!d.civook,event:{webinar:'19 NOV · Kubernetes at Scale (webinar journey)',workshop:'26 NOV · Beyond the Container (workshop)',academy:'Civo Kubernetes Academy'+(d.code?' · '+d.code:'')}[EDITION],source:S.utm||'hackspace',consent:true})});
    const j=await r.json().catch(()=>null);
    if (r.ok && j && j.status==='success') res=j;
    else if (j && j.message && [400,403,404,409].includes(r.status)){ er.textContent=j.message; b.disabled=false; b.firstChild.textContent='Claim my lab'; return }
    else demo=true;
  }catch(x){ demo=true }
  if (demo){ S.apiKey='demo-'+Math.random().toString(36).slice(2,9); S.accountId=d.code||'demo'; S.demo=true; S.clusterName=(EDITION==='workshop'&&d.code)?('launchpad-'+d.code.toLowerCase()):null }
  else { S.apiKey=res.api_key; S.accountId=res.account_id; S.demo=false; S.clusterName=EDITION==='workshop'?(res.cluster||('launchpad-'+d.code.toLowerCase())):null }
  if (EDITION==='workshop'){ S.apiKey=null; S.own=demo?!d.code:!!res.own; S.accountId=demo?(d.code||'own'):res.account_id; S.clusterName=S.own?null:(demo?'btc-demo':(res.cluster||null)); KCFG=(res&&res.kubeconfig)||null }
  S.reg={ name:d.name, email:d.email, code:d.code, civo:d.civo||'', token:(res&&res.token)||'', seat:(res&&res.seat)||0, at:Date.now() };
  if (S.clusterName) preProvision();
  save(); renderKey(); confetti(140);
  const p=S.pendingLab; if (p){ S.pendingLab=null; save(); return go('lab-'+p) }
  go(myEventRoute());
}
let KCFG = null; // kept in memory only: a kubeconfig is a cluster-admin credential
async function downloadKubeconfig(){

  if (S.demo){ toast('Demo mode: no real cluster attached'); return }
  if (!KCFG){
    try{
      const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({participant:S.participant,name:S.reg.name,email:S.reg.email,access_code:S.reg.code,civo_account:S.reg.civo||'',civo_signup:true,consent:true,event:'26 NOV · Beyond the Container (workshop)'})});
      const j=await r.json().catch(()=>null);
      if (r.ok && j && j.kubeconfig){ KCFG=j.kubeconfig; S.clusterName=j.cluster||S.clusterName; save() }
      else { toast((j&&j.message)||'Kubeconfig not available yet — ask a facilitator'); return }
    }catch(e){ toast('Could not reach Launchpad — check your Wi-Fi'); return }

  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([KCFG],{type:'application/x-yaml'}));
  a.download='kubeconfig-'+(S.clusterName||'workshop')+'.yaml'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('✓ kubeconfig-'+(S.clusterName||'workshop')+'.yaml saved');
}

function startMission(){ const p=S.pendingLab; S.pendingLab=null; save(); go(p?'lab-'+p:(LABS.find(l=>!labDone(l))||LABS[0]).id.replace(/^/,'lab-')) }
