# Builds the Civo Launchpad image and pushes it to GitHub Container Registry.
#   ghcr.io/<owner>/civo-launchpad:<edition>-<short-sha>  and  :<edition>-latest
# After the first run: GitHub → Packages → civo-launchpad → Package settings → Change visibility → Public
# (the image holds no secrets), so the cluster can pull it without credentials.
name: launchpad-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [workshop, academy]
    steps:
      - uses: actions/checkout@v4
      - name: Build the editions (dist/)
        run: python3 tools/build_editions.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/civo-launchpad" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.launchpad
          build-args: EDITION=${{ matrix.edition }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ matrix.edition }}-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.repo }}:${{ matrix.edition }}-latest
          cache-from: type=gha,scope=${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition }}
