# Civo Launchpad on the "launchpad-ops" cluster. Rendered by scripts/deploy-launchpad.ps1:
#   __HOST__  launchpad.<traefik-LB-IP>.sslip.io      __EMAIL__  ACME contact for Let's Encrypt
#   __IMAGE__ ghcr.io/<owner>/civo-launchpad:workshop-latest
#   __OPEN__ / __CLOSE__  event window (RFC3339). Simulation: now .. now+1 day. Event: 26 Nov 10:00 .. 23:59 WIB.
# Secrets created by the script (never committed): launchpad-admin (ADMIN_TOKEN), launchpad-cert (CERT_SECRET,
# created once and kept: it fixes every Certificate ID / QR code, so never rotate it after the event),
# optional workshop-seats + workshop-kubeconfigs (backup seats from provision-workshop.ps1).
apiVersion: v1
kind: Namespace
metadata:
  name: civo-workshop
  labels: { app.kubernetes.io/part-of: civo-launchpad }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __EMAIL__
    privateKeySecretRef: { name: letsencrypt-prod-account }
    solvers:
      - http01:
          ingress: { ingressClassName: traefik }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: launchpad-data
  namespace: civo-workshop
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: civo-volume
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchpad
  namespace: civo-workshop
  labels: &labels
    app.kubernetes.io/name: launchpad
    app.kubernetes.io/part-of: civo-launchpad
spec:
  # Registrations and race results live in memory + /data: exactly 1 replica, Recreate.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: launchpad }
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: launchpad
          image: __IMAGE__
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: HOME, value: /tmp }          # kubectl cache (root filesystem is read-only)
            - { name: REGISTRATIONS_FILE, value: /data/registrations.jsonl }
            - { name: RACE_FILE, value: /data/race.json }
            - { name: OWN_KUBECONFIG_DIR, value: /data/own-kubeconfigs }
            - { name: KUBECONFIG_DIR, value: /kubeconfigs }
            - { name: CLUSTER_POOL, value: "1" }
            - { name: RACE_P95_MS, value: "1500" }
            - { name: EVENT_OPEN, value: "__OPEN__" }
            - { name: EVENT_CLOSE, value: "__CLOSE__" }
          envFrom:
            - secretRef: { name: launchpad-admin }
            - secretRef: { name: launchpad-cert, optional: true }
            - secretRef: { name: workshop-seats, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: kubeconfigs, mountPath: /kubeconfigs, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: launchpad-data }
        - name: kubeconfigs
          secret: { secretName: workshop-kubeconfigs, optional: true, defaultMode: 0440 }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: launchpad
  namespace: civo-workshop
spec:
  selector: { app.kubernetes.io/name: launchpad }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: launchpad
  namespace: civo-workshop
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [__HOST__]
      secretName: launchpad-tls
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: launchpad, port: { number: 80 } }
