{% match left %}{% when Some with (l) %}<span class="counter" hx-get="/register/seats" hx-trigger="every 30s" hx-swap="outerHTML"><b>{{ l }}</b> seats left on the grid</span>{% when None %}{% if registered >= 20 %}<span class="counter" hx-get="/register/seats" hx-trigger="every 30s" hx-swap="outerHTML"><b>{{ registered }}</b> builders already on the grid</span>{% else %}<span hx-get="/register/seats" hx-trigger="every 30s" hx-swap="outerHTML"></span>{% endif %}{% endmatch %}
